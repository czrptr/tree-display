[package]
name = "tree-display"
authors = ["Cezar Petriuc <contact@czrptr.com>"]
repository = "https://github.com/czrptr/tree-display"
documentation = "https://docs.rs/tree-display/latest/tree-display"
description = """
Display Rust data structures as syntax-highlighted trees in the terminal with a single derive macro.
Features full color theming, context-aware value mapping, and intelligent formatting for collections.
Perfect for debugging, compiler diagnostics, and AST inspection.
"""
categories = [
  "visualization",
  "command-line-utilities",
  "development-tools::debugging",
  "development-tools::procedural-macro-helpers",
]
keywords = [
  "tree",
  "debug",
  "formatting",
  "diagnostics",
  "macro",
  "macros",
  "derive",
  "procedural-macro",
  "pretty-print",
  "syntax-highlighting",
]

version = "1.0.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license-file = "LICENSE"

[workspace]
members = ["derive"]

[dependencies]
derive = { package = "tree-display-derive", path = "./derive", version = "1.0" }
anstyle = { version = "1.0", optional = true }
anstream = { version = "1.0", optional = true }
chumsky = { version = "0.12", optional = true }

[features]
default = ["color"]
color = ["dep:anstyle", "dep:anstream"]
chumsky = ["dep:chumsky"]

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
